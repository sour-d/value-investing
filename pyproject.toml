[project]
name = "stocks"
version = "0.1.0"
description = "Local screening, journal and portfolio tracker for NIFTY SMALLCAP 250 equities"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "yfinance>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
stocks = "stocks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]
